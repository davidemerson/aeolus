<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Two, media-scoped, so browser chrome follows the theme. This app has
         always shipped an ink-950 chrome colour against a light-only UI; the
         dark value is finally telling the truth and light gets the surface it
         actually renders. These follow the OS, not data-theme — a meta tag
         cannot see the attribute. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />

    <title>Aeolus</title>
    <meta name="description" content="Collaborative LaTeX and Typst editor." />

    <!--
      Favicon set. Modern browsers prefer the SVG; the ICO is a
      fallback for older Windows / pinned-tab surfaces.
      apple-touch-icon is the icon iOS shows on the home screen and
      in system sign-in sheets. Regenerate via
      scripts/build-brand-assets.mjs.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter card for shared links. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aeolus" />
    <meta property="og:title" content="Aeolus" />
    <meta property="og:description" content="Collaborative LaTeX and Typst editor." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aeolus" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aeolus" />
    <meta name="twitter:description" content="Collaborative LaTeX and Typst editor." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body class="bg-page text-body font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
